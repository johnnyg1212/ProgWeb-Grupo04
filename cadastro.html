<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Toupeira - Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
  <main>
    <h1>
      <img src="img/logo.png" alt="Logo da Toupeira">
    </h1>

    <div class="container">
      <form action="index.html">
        <div class="campo">
          <label for="nome">&lt; Nome Completo &gt;</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
          <label for="nascimento">&lt; Data de Nascimento &gt;</label>
          <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="campo">
          <label for="cpf">&lt; CPF &gt;</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
        </div>

        <div class="campo">
          <label for="telefone">&lt; Telefone &gt;</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999" required>
        </div>

        <div class="campo">
          <label for="email">&lt; Email &gt;</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="username">&lt; Nome de Usuário &gt;</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="campo">
          <label for="senha">&lt; Senha &gt;</label>
          <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <p class="link-cadastro">
        <a href="index.html">Já possui cadastro? Entrar</a>
      </p>
    </div>
  </main>
</body>
</html>
